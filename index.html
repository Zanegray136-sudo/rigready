<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RigReady</title>
<meta name="theme-color" content="#0e1014">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1014;--panel:#161920;--panel2:#1c2029;--line:#262b36;--line2:#323846;
  --text:#e6e8ee;--muted:#8b93a7;--accent:#f5a524;--accent-ink:#1a1204;
  --ok:#3ecf8e;--warn:#f5a524;--bad:#ff5d5d;--info:#5aa9ff;--grey:#6b7385;
  --r:10px;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%}
a{color:inherit}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:14px;margin:0 0 12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:var(--mono);font-size:13px}
.ic{width:18px;height:18px;flex:none}
.center{display:grid;place-items:center;min-height:60vh}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font:inherit;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#47506a}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:8px;border:0;background:transparent;color:var(--text);cursor:pointer}
.icon-btn:hover{background:var(--panel2)}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;min-height:38px}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:0;border-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
.field{margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fgrid .full{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* layout */
.demo-bar{background:#2a2110;color:#f7cf86;font-size:12px;padding:7px 16px;text-align:center;border-bottom:1px solid #3d3016}
.layout{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:16px 12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em;padding:4px 8px 18px}
.brand .logo{width:28px;height:28px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand .logo .ic{width:17px;height:17px}
.nav-i{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;margin-bottom:2px}
.nav-i:hover{background:var(--panel2);color:var(--text)}
.nav-i.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.badge{margin-left:auto;font-style:normal;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px}
.me{padding:4px 8px 10px}
.me strong{display:block;font-weight:600}
.side-foot .nav-i{width:100%;border:0;background:none;font:inherit;cursor:pointer}
.main{padding:28px 32px 80px;max-width:1240px;width:100%}
.topbar{display:none}
.scrim{display:none}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-h p{margin-top:4px}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2>.card{margin-bottom:0}
.stack>*+*{margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-decoration:none}
.stat b{display:block;font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.stat.bad b{color:var(--bad)}.stat.warn b{color:var(--warn)}.stat.ok b{color:var(--ok)}
.alert{border-radius:var(--r);padding:14px 16px;margin-bottom:16px;border:1px solid}
.alert.bad{background:#2a1416;border-color:#5a2328}
.alert.warn{background:#2a2110;border-color:#4d3a14}
.alert-h{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px}
.alert.bad .alert-h{color:#ff8a8a}.alert.warn .alert-h{color:#f7cf86}
.alert ul{margin:0;padding:0;list-style:none}
.alert li{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid rgba(255,255,255,.06);flex-wrap:wrap}
.alert li:first-child{border-top:0}
.alert a{text-decoration:none}
.empty{color:var(--muted);padding:18px 0;text-align:center}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-ok{color:var(--ok);background:rgba(62,207,142,.12)}
.s-faulty{color:var(--bad);background:rgba(255,93,93,.13)}
.s-in-repair{color:var(--warn);background:rgba(245,165,36,.13)}
.s-out-of-service{color:#ff8a5d;background:rgba(255,138,93,.13)}
.s-retired{color:var(--grey);background:rgba(107,115,133,.15)}
.d-overdue{color:var(--bad);background:rgba(255,93,93,.13)}
.d-soon{color:var(--warn);background:rgba(245,165,36,.13)}
.d-ok{color:var(--ok);background:rgba(62,207,142,.12)}
.tag{font-family:var(--mono);font-size:13px;font-weight:500;color:var(--accent)}

/* tables & lists */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--panel2)}
.tbl tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
.list{list-style:none;margin:0;padding:0}
.list>li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.list>li:first-child{border-top:0}
.list a{text-decoration:none}
.filters{display:grid;grid-template-columns:1fr 160px 170px;gap:10px;margin-bottom:14px}
.tabs{display:inline-flex;background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:3px;gap:2px}
.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:6px 12px;border-radius:6px;cursor:pointer}
.tabs button.on{background:var(--panel2);color:var(--text)}

/* asset detail */
.a-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.a-head h1 .tag{font-size:22px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 18px}
.kv div span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:3px}
.kv div b{font-weight:500}
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}

/* timeline */
.tl{list-style:none;margin:0;padding:0}
.log{display:grid;grid-template-columns:14px 1fr auto;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.log:first-child{border-top:0}
.log-dot{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--grey)}
.k-fault .log-dot{background:var(--bad)}.k-repair .log-dot{background:var(--ok)}.k-service .log-dot{background:var(--info)}.k-inspection .log-dot{background:var(--warn)}
.log-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.kind{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.log p{margin:5px 0 0;white-space:pre-wrap;color:#c9cdd8}
.meta{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.thumb{width:72px;height:72px;border-radius:8px;object-fit:cover;background:var(--panel2);border:1px solid var(--line2);cursor:pointer}

/* scan */
.reader{width:100%;max-width:420px;margin:0 auto 14px;border-radius:12px;overflow:hidden;background:#000;min-height:0}
.reader video{display:block}
.scan-big{display:grid;place-items:center;gap:14px;text-align:center;padding:26px 10px}
.scan-ring{width:110px;height:110px;border-radius:24px;border:2px dashed var(--line2);display:grid;place-items:center;color:var(--accent)}
.scan-ring .ic{width:46px;height:46px}
.lookup{display:flex;gap:8px;max-width:520px;margin:0 auto}
.lookup input{font-family:var(--mono)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(5,6,9,.7);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow-y:auto}
.modal.open{display:flex}
.modal-box{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 14px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:16px}
.modal-b{padding:20px}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding-top:6px}
.note{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:14px}

/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.auth-card{width:100%;max-width:380px}
.auth-card .brand{justify-content:center;font-size:22px;padding-bottom:6px}
.auth-card .brand .logo{width:36px;height:36px}
.auth-card .card{padding:22px;margin-top:20px}
.auth-card .tabs{display:flex;margin-bottom:18px}
.auth-card .tabs button{flex:1}
.err{color:var(--bad);font-size:13px;margin-top:10px;min-height:1em}

/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#232836;border:1px solid var(--line2);padding:10px 16px;border-radius:9px;box-shadow:0 8px 30px rgba(0,0,0,.4);font-weight:500;animation:tin .2s ease}
.toast.bad{border-color:#5a2328;color:#ff9a9a}.toast.warn{border-color:#4d3a14;color:#f7cf86}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}

#print{display:none}

@media (max-width:980px){.stats{grid-template-columns:repeat(2,1fr)}.cols,.grid2{grid-template-columns:1fr}.kv{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
  .layout{display:block}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .topbar .brand{padding:0;font-size:15px}
  .topbar .brand .logo{width:24px;height:24px}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s ease;height:100%}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30}
  .main{padding:18px 16px 90px}
  .filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}
  .fgrid{grid-template-columns:1fr}
  .hide-m{display:none}
  .fab{position:fixed;right:18px;bottom:20px;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:25}
  .fab .ic{width:26px;height:26px}
}
@media (min-width:861px){.fab{display:none}}

@media print{
  body{background:#fff;color:#000}
  #app,#modal,#toast{display:none!important}
  #print{display:block;font-family:Inter,Arial,sans-serif;font-size:11pt;color:#000}
  #print h1{font-size:18pt;margin:0 0 4pt}
  #print h2{color:#000;font-size:11pt;margin:16pt 0 6pt}
  #print table{width:100%;border-collapse:collapse}
  #print th,#print td{border-bottom:1px solid #ccc;padding:5pt 6pt;text-align:left;vertical-align:top;font-size:10pt}
  #print th{background:#f2f2f2}
  #print .sub{color:#555;margin-bottom:10pt}
}
</style>

<body>
<div id="app"><div class="center muted">Loading…</div></div>
<div id="modal" class="modal"><div class="modal-box"><div class="modal-h"><h3 id="modal-title"></h3><button class="icon-btn" data-act="modal-close" aria-label="Close"></button></div><div class="modal-b" id="modal-body"></div></div></div>
<div id="toast"></div>
<div id="print"></div>

<script>
/* ============================================================
   RigReady — lighting fixture & console maintenance log
   ============================================================ */
const CFG = Object.assign({ SUPABASE_URL:'', SUPABASE_ANON_KEY:'', APP_NAME:'RigReady', FAULT_ALERT_DAYS:60, DUE_SOON_DAYS:14 }, window.RIGREADY_CONFIG || {});
const DEMO = !CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY;
const sb = (!DEMO && window.supabase) ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY) : null;

const BAD = ['Faulty','In repair','Out of service'];
const STATUSES = ['OK','Faulty','In repair','Out of service','Retired'];
const CATS = ['Fixture','Console','Other'];
const KINDS = ['Fault','Repair','Service','Inspection','Note'];
const DAY = 864e5;

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').trim().toLowerCase();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const fmtDate = d => d ? new Date(d).toLocaleDateString(undefined, {day:'numeric', month:'short', year:'numeric'}) : '—';
const fmtDT = d => d ? new Date(d).toLocaleString(undefined, {day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit'}) : '—';
const daysSince = d => Math.floor((Date.now() - new Date(d)) / DAY);
const slug = s => norm(s).replace(/[^a-z0-9]+/g, '-');
const pill = st => `<span class="pill s-${slug(st)}">${h(st)}</span>`;
const isAdmin = () => S.profile?.role === 'admin';
const assetById = id => S.assets.find(a => a.id === id);
const nameOf = id => S.profiles.find(p => p.id === id)?.name || 'Unknown';
const whoOf = l => l.tech_name || nameOf(l.created_by);
const hasH = v => v != null && v !== '';
const fmtH = v => hasH(v) ? Number(v).toLocaleString() + ' h' : '—';
const numOrNull = v => (v == null || String(v).trim() === '') ? null : Number(v);
const byNewest = (a, b) => new Date(b.created_at) - new Date(a.created_at);

const P = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  scan:'<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M7 12h10"/>',
  box:'<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7"/>',
  chart:'<path d="M5 20V11M11 20V5M17 20v-6M3 20h18"/>',
  parts:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 7-6s7 2.5 7 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M22 20c0-3-2-5.2-5-5.8"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>', menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/>',
  print:'<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>',
  download:'<path d="M12 3v12M7 10l5 5 5-5M4 21h16"/>', edit:'<path d="M4 20h4L20 8l-4-4L4 16z"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>', logout:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/>',
  camera:'<path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="4"/>', check:'<path d="M5 12l5 5 9-10"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', file:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',
  refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>',
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n] || ''}</svg>`;
const LOGO = `<span class="logo">${ic('wrench')}</span>`;
$('[data-act="modal-close"]').innerHTML = ic('x');

function toast(msg, kind='') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg;
  $('#toast').appendChild(t); setTimeout(() => t.remove(), 3200);
}
function errMsg(e) { return e?.message || e?.error_description || String(e); }

async function compressImage(file, max) {
  max = max || (DEMO ? 900 : 1600);
  if (!file.type.startsWith('image/')) return file;
  try {
    const bmp = await createImageBitmap(file);
    const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', DEMO ? .7 : .82));
    return blob || file;
  } catch { return file; }
}

/* ============================================================
   DATA LAYER — Supabase (live) or browser storage (demo)
   ============================================================ */
function supabaseApi() {
  return {
    async session() { const { data } = await sb.auth.getSession(); return data.session?.user || null; },
    async signIn(email, password) { const { error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error; },
    async signUp(name, email, password) {
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name }, emailRedirectTo: location.href.split('#')[0] } });
      if (error) throw error; return data;
    },
    async resetPw(email) { const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0] }); if (error) throw error; },
    async setPw(password) { const { error } = await sb.auth.updateUser({ password }); if (error) throw error; },
    async signOut() { await sb.auth.signOut(); },
    async profile(id) { const { data, error } = await sb.from('profiles').select('*').eq('id', id).maybeSingle(); if (error) throw error; return data; },
    async all(table) {
      let out = [], from = 0;
      for (;;) {
        const { data, error } = await sb.from(table).select('*').order('created_at', { ascending: false }).range(from, from + 999);
        if (error) throw error;
        out = out.concat(data); if (data.length < 1000) break; from += 1000;
      }
      return out;
    },
    async insert(table, row) { const { data, error } = await sb.from(table).insert(row).select().single(); if (error) throw friendly(error); return data; },
    async update(table, id, patch) { const { data, error } = await sb.from(table).update(patch).eq('id', id).select().single(); if (error) throw friendly(error); return data; },
    async remove(table, id) { const { error } = await sb.from(table).delete().eq('id', id); if (error) throw friendly(error); },
    async upload(bucket, blob, name) {
      const path = `${new Date().toISOString().slice(0,10)}/${uid().slice(0,8)}-${String(name || 'file').replace(/[^\w.\-]+/g, '_')}`;
      const { error } = await sb.storage.from(bucket).upload(path, blob, { contentType: blob.type || undefined });
      if (error) throw error; return path;
    },
    async fileUrl(bucket, path) { const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, 3600); if (error) throw error; return data.signedUrl; },
  };
  function friendly(e) {
    if (e.code === '23505') return new Error('An item with that asset tag already exists.');
    if (e.code === '42501') return new Error("You don't have permission to do that.");
    if (e.code === '23514' || /Not enough in stock/i.test(e.message || '')) return new Error('Not enough in stock for that.');
    return e;
  }
}

function demoApi() {
  const KEY = 'rigready-demo-v1'; let mem = null;
  const read = () => {
    if (mem) return mem;
    try { const r = localStorage.getItem(KEY); if (r) mem = JSON.parse(r); } catch {}
    if (!mem) { mem = demoSeed(); save(); }
    if (!mem.parts) { const x = demoParts(mem.assets); mem.parts = x.parts; mem.part_moves = x.part_moves; save(); }
    return mem;
  };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch { toast('Demo storage is full — big photos/manuals won\'t survive a reload', 'warn'); } };
  const clone = v => v === undefined ? v : JSON.parse(JSON.stringify(v));
  const dupTag = (d, tag, id) => tag && d.assets.some(a => a.id !== id && norm(a.tag) === norm(tag));
  return {
    async session() { return { id: 'demo-admin', email: 'demo@example.com' }; },
    async signIn() {}, async signUp() {}, async resetPw() {}, async setPw() {},
    async signOut() {
      if (confirm('This is demo mode. Reset the demo data back to the sample items?')) { try { localStorage.removeItem(KEY); } catch {} mem = null; location.hash = '#/dashboard'; location.reload(); }
    },
    async profile(id) { return clone(read().profiles.find(p => p.id === id)); },
    async all(t) { return clone(read()[t] || []).sort(byNewest); },
    async insert(t, row) {
      const d = read(); if (t === 'assets' && dupTag(d, row.tag)) throw new Error('An item with that asset tag already exists.');
      if (t === 'part_moves') { const pt = d.parts.find(x => x.id === row.part_id); if (!pt || pt.quantity + row.change < 0) throw new Error('Not enough in stock for that.'); pt.quantity += row.change; }
      const r = { id: uid(), created_at: new Date().toISOString(), ...row }; (d[t] = d[t] || []).push(r); save(); return clone(r);
    },
    async update(t, id, p) {
      const d = read(); if (t === 'assets' && dupTag(d, p.tag, id)) throw new Error('An item with that asset tag already exists.');
      const i = d[t].findIndex(r => r.id === id); d[t][i] = { ...d[t][i], ...p }; save(); return clone(d[t][i]);
    },
    async remove(t, id) {
      const d = read();
      if (t === 'part_moves') { const m = d.part_moves.find(x => x.id === id); const pt = m && d.parts.find(x => x.id === m.part_id); if (pt) pt.quantity -= m.change; }
      if (t === 'parts') d.part_moves = d.part_moves.filter(m => m.part_id !== id);
      d[t] = d[t].filter(r => r.id !== id);
      if (t === 'assets') { d.logs = d.logs.filter(l => l.asset_id !== id); d.schedules = d.schedules.filter(s => s.asset_id !== id); }
      save();
    },
    async upload(b, blob, name) {
      const url = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
      const d = read(); d.files = d.files || {}; const path = uid().slice(0, 8) + '-' + (name || 'file'); d.files[path] = url; save(); return path;
    },
    async fileUrl(b, path) { return read().files?.[path] || ''; },
  };
}

function longFaults() {
  return S.assets.filter(a => BAD.includes(a.status) && a.faulty_since && daysSince(a.faulty_since) >= CFG.FAULT_ALERT_DAYS)
    .sort((x, y) => new Date(x.faulty_since) - new Date(y.faulty_since));
}
function statusPatch(a, st) {
  const p = { status: st };
  if (BAD.includes(st) && !BAD.includes(a?.status)) p.faulty_since = new Date().toISOString();
  if (!BAD.includes(st)) p.faulty_since = null;
  return p;
}
function scheduleTargets(s) {
  return s.asset_id ? S.assets.filter(a => a.id === s.asset_id && a.status !== 'Retired')
    : S.assets.filter(a => a.status !== 'Retired' && norm(a.make) === norm(s.make) && norm(a.model) === norm(s.model));
}
function dueFor(s, a) {
  const last = S.logs.filter(l => l.schedule_id === s.id && l.asset_id === a.id).sort(byNewest)[0];
  const base = last ? last.created_at : a.created_at;
  let state = 'ok', dueDate = null, daysLeft = null, hoursLeft = null;
  if (s.interval_days) {
    dueDate = new Date(new Date(base).getTime() + s.interval_days * DAY);
    daysLeft = Math.ceil((dueDate - Date.now()) / DAY);
    state = daysLeft < 0 ? 'overdue' : daysLeft <= CFG.DUE_SOON_DAYS ? 'soon' : 'ok';
  }
  const basis = s.hours_basis === 'fixture' ? 'fixture_hours' : 'lamp_hours';
  if (s.interval_hours && hasH(a[basis])) {
    const lastH = last && hasH(last[basis]) ? Number(last[basis]) : 0;
    hoursLeft = Math.round(lastH + Number(s.interval_hours) - Number(a[basis]));
    if (hoursLeft <= 0) state = 'overdue';
    else if (hoursLeft <= s.interval_hours * 0.1 && state === 'ok') state = 'soon';
  }
  return { s, a, last, dueDate, daysLeft, hoursLeft, state };
}
function dueList() {
  const out = []; const rank = { overdue:0, soon:1, ok:2 };
  for (const s of S.schedules) for (const a of scheduleTargets(s)) out.push(dueFor(s, a));
  const key = d => d.daysLeft ?? d.hoursLeft ?? 1e9;
  return out.sort((x, y) => rank[x.state] - rank[y.state] || key(x) - key(y));
}
function dueText(d) {
  const p = [];
  if (d.daysLeft != null) p.push(d.daysLeft < 0 ? `${-d.daysLeft} days overdue` : d.daysLeft === 0 ? 'due today' : `due in ${d.daysLeft} days`);
  const hl = d.s.hours_basis === 'fixture' ? 'fixture' : 'lamp';
  if (d.hoursLeft != null) p.push(d.hoursLeft <= 0 ? `${-d.hoursLeft} ${hl} h over` : `${d.hoursLeft} ${hl} h left`);
  return p.join(' · ') || '—';
}
const duePill = d => `<span class="pill d-${d.state}">${d.state === 'overdue' ? 'Overdue' : d.state === 'soon' ? 'Due soon' : 'OK'}</span>`;
function manualsFor(a) {
  return S.manuals.filter(m => norm(m.make) === norm(a.make) && (!norm(m.model) || norm(m.model) === norm(a.model)));
}
function lastActivity(a) { return S.logs.find(l => l.asset_id === a.id); }

function vScan() {

      <label class="btn" style="margin:0">${ic('camera')} Take a photo<input type="file" accept="image/*" capture="environment" data-photo-scan hidden></label></div>
    </div>
    <div id="reader-file" hidden></div>
    <div class="note" id="cam-msg" hidden style="max-width:520px;margin:0 auto 14px;color:#f7cf86"></div>
    <div class="row" style="justify-content:center;margin-bottom:16px"><button class="btn" id="cam-stop" data-act="cam-stop" hidden>Stop camera</button></div>
    <form data-form="lookup" class="lookup"><input id="code-input" name="code" placeholder="Type an asset number or use a scanner gun" autocomplete="off" autocapitalize="characters" required><button class="btn">Find</button></form>
    <p class="muted small" style="text-align:center;margin-top:12px">Codes match an item's tag or serial — dashes, spaces and leading zeros don't matter (XFRAME-055 finds X-Frame 55). Unknown codes can be linked to an existing item or added new.</p>
  </section>`;
}
let qr = null;
function camProblem(e) {
  const s = (e?.name || '') + ' ' + errMsg(e);
  if (/NotAllowed|Permission|denied/i.test(s)) return 'Camera access is blocked for this site. Allow the camera in your browser settings (iPhone: Settings → Safari → Camera → Allow), then try again — or use "Take a photo".';
  if (/NotFound|no camera|Requested device not found/i.test(s)) return 'No camera found on this device. Use "Take a photo" or type the code.';
  if (/NotReadable|in use|Could not start/i.test(s)) return 'The camera is busy in another app. Close it and try again, or use "Take a photo".';
  return 'The live camera couldn\'t start (' + s.trim() + '). Use "Take a photo" instead.';
}
function showCamMsg(msg) { const el = $('#cam-msg'); if (el) { el.textContent = msg; el.hidden = !msg; } }
async function camStart() {
  showCamMsg('');
  if (!window.Html5Qrcode) return showCamMsg('The scanner didn\'t load. Reload the page and try again.');
  if (!isSecureContext) return showCamMsg('The camera only works when the app is opened from its https:// web address.');
  if (!navigator.mediaDevices?.getUserMedia) return showCamMsg('This browser can\'t use the live camera (some in-app browsers block it). Open the link in Safari or Chrome, or use "Take a photo".');
  $('#scan-idle').hidden = true; $('#cam-stop').hidden = false; $('#reader').hidden = false;
  try {
    qr = new Html5Qrcode('reader', { verbose: false });
    await qr.start({ facingMode: 'environment' }, { fps: 10, aspectRatio: 1.333 },
      txt => { camStop(); if (navigator.vibrate) navigator.vibrate(60); lookup(txt); });
  } catch (e) {
    try { qr?.clear(); } catch {}
    qr = null; $('#scan-idle').hidden = false; $('#cam-stop').hidden = true; $('#reader').hidden = true;
    showCamMsg(camProblem(e));
  }
}
async function scanPhoto(input) {
  const file = input.files?.[0]; input.value = ''; if (!file) return;
  if (!window.Html5Qrcode) return showCamMsg('The scanner didn\'t load. Reload the page and try again.');
  showCamMsg('Reading code…');
  const r = new Html5Qrcode('reader-file', { verbose: false });
  try { const txt = await r.scanFile(file, false); showCamMsg(''); lookup(txt); }
  catch { showCamMsg('Couldn\'t find a QR code in that photo. Get closer so the code fills most of the picture, keep it in focus, and try again.'); }
  finally { try { r.clear(); } catch {} }
}
async function camStop() {
  if (!qr) return; const q = qr; qr = null;
  try { await q.stop(); q.clear(); } catch {}
  const idle = $('#scan-idle'); if (idle) { idle.hidden = false; $('#cam-stop').hidden = true; $('#reader').hidden = true; }
}
function lookup(raw, fromRoute) {
  let code = String(raw || '').trim();
  const m = code.match(/#\/tag\/(.+)$/); if (m) code = decodeURIComponent(m[1]);
  if (!code) return;
  const k = codeKey(code);
  const a = S.assets.find(x => norm(x.tag) === norm(code)) || S.assets.find(x => x.serial && norm(x.serial) === norm(code))
    || S.assets.find(x => codeKey(x.tag) === k) || S.assets.find(x => x.serial && codeKey(x.serial) === k);
  if (a) { const to = '#/asset/' + a.id; fromRoute ? location.replace(to) : (location.hash = to); return; }
  if (fromRoute) location.replace('#/scan');
  unknownModal(code);
}
/* Codes match ignoring case, spaces, dashes and leading zeros: "XFRAME-055" = "X-Frame 55" */
function codeKey(s) {
  return String(s || '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim().split(' ')
    .map(t => /^\d+$/.test(t) ? t.replace(/^0+(?=\d)/, '') : t).join('');
}
function unknownModal(code) {
  openModal('Code not found', `<div class="note">Scanned <span class="tag">${h(code)}</span> — no item matches it yet.</div>
    <form data-form="link-code">${datalists()}<input type="hidden" name="code" value="${h(code)}">
      <div class="field"><label>It's this existing item (search by tag or serial)</label><input name="tag" list="dl-tag" placeholder="e.g. X-Frame 55" autocomplete="off" required></div>
      <p class="muted small" style="margin:-6px 0 14px">The item's tag becomes <span class="mono">${h(code)}</span>, so this sticker opens it from now on.</p>
      <div class="modal-f" style="justify-content:space-between"><button type="button" class="btn" data-act="add-from-code" data-code="${h(code)}">${ic('plus')} Add as new item</button><button class="btn primary">Link to item</button></div>
    </form>`);
}
async function linkCode(f) {
  const fd = new FormData(f); const code = fd.get('code'), t = fd.get('tag');
  const a = S.assets.find(x => norm(x.tag) === norm(t)) || S.assets.find(x => x.serial && norm(x.serial) === norm(t)) || S.assets.find(x => codeKey(x.tag) === codeKey(t));
  if (!a) throw new Error('No item with that tag or serial.');
  if (!confirm(`Change ${a.tag} (${a.model}) to tag ${code}?`)) return;
  const old = a.tag;
  Object.assign(a, await api.update('assets', a.id, { tag: code, updated_at: new Date().toISOString(), updated_by: S.user.id }));
  S.logs.unshift(await api.insert('logs', { asset_id: a.id, kind: 'Note', title: `QR code linked: ${code}`, details: `Tag changed from ${old}`, photos: [], created_by: S.user.id }));
  toast('Linked'); closeModal(); location.hash = '#/asset/' + a.id;
}

function findAsset(t) {
  t = String(t || '').trim(); if (!t) return null;
  return S.assets.find(x => norm(x.tag) === norm(t)) || S.assets.find(x => x.serial && norm(x.serial) === norm(t)) || S.assets.find(x => codeKey(x.tag) === codeKey(t));

async function submitCheckout(f) {
  const fd = new FormData(f); const pt = partById(fd.get('part_id'));
  if (!pt) throw new Error('Choose a part.');
  const qty = parseInt(fd.get('qty'), 10);
  if (!(qty > 0)) throw new Error('Quantity must be at least 1.');
  if (qty > pt.quantity) throw new Error(`Only ${pt.quantity} in stock.`);
  const a = findAsset(fd.get('tag')); if (!a) throw new Error('No fixture with that tag or serial — check it and try again.');
  const person = fd.get('person').trim(); if (!person) throw new Error('Who is taking it?');
  const prof = S.profiles.find(x => norm(x.name) === norm(person));
  const m = await api.insert('part_moves', { part_id: pt.id, change: -qty, kind: 'checkout', person_name: person, person_id: prof?.id || null, asset_id: a.id, notes: fd.get('notes').trim(), created_by: S.user.id });
  S.part_moves.unshift(m); pt.quantity -= qty;
  toast(`${qty} × ${pt.name} checked out to ${person} for ${a.tag}`); closeModal(); render();
}
function restockModal(pt) {
  openModal('Add stock — ' + pt.name, `<form data-form="restock"><input type="hidden" name="part_id" value="${pt.id}">
    <div class="fgrid"><div class="field"><label>Quantity received</label><input name="qty" type="number" min="1" step="1" value="1" required inputmode="numeric"></div>
      <div class="field"><label>Price each (optional)</label><input name="price" type="number" min="0" step="0.01" value="${h(pt.unit_price ?? '')}" inputmode="decimal"></div>
      <div class="field full"><label>Notes (optional)</label><input name="notes" placeholder="e.g. ShowTech order, invoice number"></div></div>
    <div class="modal-f"><button type="button" class="btn" data-act="modal-close">Cancel</button><button class="btn primary">Add stock</button></div></form>`);
}
async function submitRestock(f) {
  const fd = new FormData(f); const pt = partById(fd.get('part_id')); const qty = parseInt(fd.get('qty'), 10);
  if (!(qty > 0)) throw new Error('Quantity must be at least 1.');
  const m = await api.insert('part_moves', { part_id: pt.id, change: qty, kind: 'restock', notes: fd.get('notes').trim(), created_by: S.user.id });
  S.part_moves.unshift(m); pt.quantity += qty;
  const price = numOrNull(fd.get('price'));
  if (price != null && price !== Number(pt.unit_price)) Object.assign(pt, await api.update('parts', pt.id, { unit_price: price, updated_at: new Date().toISOString() }));
  toast(`Added ${qty}`); closeModal(); render();
}
async function returnPart(id) {
  const m = S.part_moves.find(x => x.id === id); const pt = m && partById(m.part_id); if (!pt) return;
  if (!confirm(`Return ${-m.change} × ${pt.name} to stock (came back unused)?`)) return;
  try {
    const r = await api.insert('part_moves', { part_id: pt.id, change: -m.change, kind: 'return', person_name: m.person_name, asset_id: m.asset_id, notes: 'Return of ' + m.id, created_by: S.user.id });
    S.part_moves.unshift(r); pt.quantity += -m.change; toast('Returned to stock'); render();
  } catch (e) { toast(errMsg(e), 'bad'); }
}
async function undoMove(id) {
  const m = S.part_moves.find(x => x.id === id); const pt = m && partById(m.part_id); if (!pt) return;
  if (!confirm('Undo this entry? Use this only to fix a mistake — stock goes back to what it was before it.')) return;
  try { await api.remove('part_moves', id); S.part_moves = S.part_moves.filter(x => x.id !== id); pt.quantity -= m.change; toast('Undone'); render(); }
  catch (e) { toast(errMsg(e), 'bad'); }
}
function partModal(pt) {

    <div class="modal-f"><button type="button" class="btn" data-act="modal-close">Cancel</button><button class="btn primary">${pt ? 'Save' : 'Add part'}</button></div></form>`);
}
async function submitPart(f) {
  const fd = Object.fromEntries(new FormData(f)); const id = fd.id;
  const row = { name: fd.name.trim(), make: fd.make.trim(), fits: fd.fits.trim(), supplier_code: fd.supplier_code.trim(), part_number: fd.part_number.trim(),
    unit_price: numOrNull(fd.unit_price), condition: fd.condition.trim(), min_qty: parseInt(fd.min_qty || '0', 10) || 0, location: fd.location.trim(), notes: fd.notes.trim(), updated_at: new Date().toISOString() };
  const qty = parseInt(fd.quantity || '0', 10) || 0;
  let pt;
  if (id) {
    pt = partById(id); Object.assign(pt, await api.update('parts', id, row));
    if (qty !== pt.quantity) { const m = await api.insert('part_moves', { part_id: id, change: qty - pt.quantity, kind: 'adjust', notes: 'Stock count corrected', created_by: S.user.id }); S.part_moves.unshift(m); pt.quantity = qty; }
  } else {
    pt = await api.insert('parts', { ...row, quantity: 0 }); S.parts.push(pt);
    if (qty > 0) { const m = await api.insert('part_moves', { part_id: pt.id, change: qty, kind: 'restock', notes: 'Starting stock', created_by: S.user.id }); S.part_moves.unshift(m); pt.quantity = qty; }
  }
  toast(id ? 'Saved' : 'Part added'); closeModal(); location.hash = '#/part/' + pt.id; render();
}

async function submitAsset(f) {
  const fd = Object.fromEntries(new FormData(f)); const id = fd.id; delete fd.id;
  for (const k of ['tag','serial','make','model','location','notes']) fd[k] = (fd[k] || '').trim();
  fd.lamp_hours = numOrNull(fd.lamp_hours); fd.fixture_hours = numOrNull(fd.fixture_hours);
  const old = id ? assetById(id) : null;
  if (old) {
    const changed = fd.status !== old.status;
    const patch = { ...fd, updated_at: new Date().toISOString(), updated_by: S.user.id };
    if (changed) Object.assign(patch, statusPatch(old, fd.status)); else delete patch.status;
    const saved = await api.update('assets', id, patch); Object.assign(old, saved);
    if (changed) {
      const l = await api.insert('logs', { asset_id: id, kind: 'Note', title: `Status changed to ${fd.status}`, details: '', photos: [], status_after: fd.status, created_by: S.user.id });
      S.logs.unshift(l);
    }
    toast('Saved'); closeModal(); render();
  } else {
    const row = { ...fd, ...statusPatch(null, fd.status), updated_by: S.user.id };
    const saved = await api.insert('assets', row); S.assets.push(saved);
    toast('Item added'); closeModal(); location.hash = '#/asset/' + saved.id;
  }
}

  $('#modal-body [name=kind]').dataset.cur = a.status;

async function submitLog(f) {
  const fd = new FormData(f); const a = assetById(fd.get('asset_id'));
  for (const [k, label] of [['title','Summary'],['details','Details'],['parts','Parts used']]) if (!String(fd.get(k) || '').trim()) throw new Error(label + ' is required.');
  const files = [...f.querySelector('[name=photos]').files];
  const photos = [];
  for (const file of files) { const blob = await compressImage(file); photos.push(await api.upload('photos', blob, (file.name || 'photo').replace(/\.\w+$/, '') + '.jpg')); }
  const lampH = numOrNull(fd.get('lamp_hours')), fixH = numOrNull(fd.get('fixture_hours'));
  const kind = fd.get('kind'), status_after = fd.get('status_after');
  const row = { asset_id: a.id, kind, title: fd.get('title').trim(), details: fd.get('details').trim(), parts: fd.get('parts').trim(),
    lamp_hours: lampH, fixture_hours: fixH, status_after: status_after !== a.status || kind === 'Fault' || kind === 'Repair' ? status_after : null,
    schedule_id: kind === 'Service' ? (fd.get('schedule_id') || null) : null, photos, created_by: S.user.id };
  const log = await api.insert('logs', row); S.logs.unshift(log);
  const patch = {};
  if (status_after !== a.status) Object.assign(patch, statusPatch(a, status_after));
  if (lampH != null && lampH !== Number(a.lamp_hours)) patch.lamp_hours = lampH;
  if (fixH != null && fixH !== Number(a.fixture_hours)) patch.fixture_hours = fixH;
  if (Object.keys(patch).length) { patch.updated_at = new Date().toISOString(); patch.updated_by = S.user.id; Object.assign(a, await api.update('assets', a.id, patch)); }
  toast('Entry saved'); closeModal(); render();
}

async function submitSched(f) {
  const fd = Object.fromEntries(new FormData(f));
  const row = { task: fd.task.trim(), interval_days: fd.interval_days ? parseInt(fd.interval_days) : null, interval_hours: fd.interval_hours ? Number(fd.interval_hours) : null, hours_basis: fd.hours_basis || 'lamp' };
  if (!row.interval_days && !row.interval_hours) throw new Error('Set an interval in days, hours, or both.');
  if (fd.scope === 'asset') {
    const a = S.assets.find(x => norm(x.tag) === norm(fd.tag)); if (!a) throw new Error('No item with that asset tag.');
    row.asset_id = a.id;
  } else {
    if (!fd.make.trim() || !fd.model.trim()) throw new Error('Enter the make and model.');
    row.make = fd.make.trim(); row.model = fd.model.trim();
    if (!scheduleTargets(row).length && !confirm(`No items match ${row.make} ${row.model} yet. Add the schedule anyway?`)) return;
  }
  S.schedules.unshift(await api.insert('schedules', row)); toast('Schedule added'); closeModal(); render();
}

async function submitManual(f) {
  const fd = new FormData(f); const file = fd.get('file'); const url = fd.get('url').trim();
  if ((!file || !file.size) && !url) throw new Error('Upload a file or paste a link.');
  const row = { make: fd.get('make').trim(), model: fd.get('model').trim(), title: fd.get('title').trim(), url: url || null, file_path: null, created_by: S.user.id };
  if (file && file.size) row.file_path = await api.upload('manuals', file, file.name);
  S.manuals.unshift(await api.insert('manuals', row)); toast('Manual added'); closeModal(); render();

async function openFile(bucket, path) {
  const w = window.open('', '_blank');
  try { const url = await api.fileUrl(bucket, path); if (!url) throw new Error('File not found');
    if (url.startsWith('data:')) { w.document.write(`<title>File</title><body style="margin:0;background:#111"><iframe src="${url}" style="border:0;width:100vw;height:100vh"></iframe>`); }
    else w.location = url;
  } catch (e) { w?.close(); toast(errMsg(e), 'bad'); }
}
async function openManual(id) {
  const m = S.manuals.find(x => x.id === id); if (!m) return;
  if (m.file_path) return openFile('manuals', m.file_path);
  window.open(m.url, '_blank', 'noopener');
}

/* ---------- deletes ---------- */
async function del(table, id, msg, after) {
  if (!confirm(msg)) return;
  try { await api.remove(table, id); S[table] = S[table].filter(r => r.id !== id); after?.(); toast('Deleted'); render(); } catch (e) { toast(errMsg(e), 'bad'); }
}

/* ---------- exports & printing ---------- */
function toCSV(rows, cols) {
  const esc = v => { v = v == null ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return [cols.map(c => esc(c[0])).join(','), ...rows.map(r => cols.map(c => esc(c[1](r))).join(','))].join('\r\n');
}
function downloadText(name, text) {
  const u = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' }));
  const l = document.createElement('a'); l.href = u; l.download = name; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
}
const stamp = () => new Date().toISOString().slice(0, 10);
const tagOf = id => assetById(id)?.tag || '';
function exportCSV(what, opts = {}) {
  if (what === 'inventory') downloadText(`inventory-${stamp()}.csv`, toCSV(filteredAssetsAll(), [
    ['Asset tag', a => a.tag], ['Serial', a => a.serial], ['Type', a => a.category], ['Make', a => a.make], ['Model', a => a.model], ['Location', a => a.location],
    ['Status', a => a.status], ['Faulty since', a => a.faulty_since ? fmtDate(a.faulty_since) : ''], ['Days faulty', a => a.faulty_since ? daysSince(a.faulty_since) : ''], ['Lamp hours', a => a.lamp_hours], ['Fixture hours', a => a.fixture_hours], ['Notes', a => a.notes]]));
  if (what === 'faults') downloadText(`faults-${stamp()}.csv`, toCSV(faultRows(), [
    ['Asset tag', a => a.tag], ['Make', a => a.make], ['Model', a => a.model], ['Status', a => a.status], ['Faulty since', a => fmtDate(a.faulty_since)], ['Days', a => a.faulty_since ? daysSince(a.faulty_since) : ''],
    ['Over limit', a => a.faulty_since && daysSince(a.faulty_since) >= CFG.FAULT_ALERT_DAYS ? 'YES' : ''], ['Latest note', a => lastActivity(a)?.title || ''], ['Location', a => a.location]]));
  if (what === 'due') downloadText(`service-due-${stamp()}.csv`, toCSV(dueList(), [
    ['Asset tag', d => d.a.tag], ['Model', d => d.a.model], ['Task', d => d.s.task], ['Status', d => d.state], ['Due date', d => d.dueDate ? fmtDate(d.dueDate) : ''],
    ['Days left', d => d.daysLeft ?? ''], ['Hours left', d => d.hoursLeft ?? ''], ['Last done', d => d.last ? fmtDate(d.last.created_at) : 'Never']]));
  if (what === 'parts') downloadText(`spare-parts-${stamp()}.csv`, toCSV(filteredParts(), [
    ['Part', p => p.name], ['Make', p => p.make], ['Fits', p => p.fits], ['Supplier code', p => p.supplier_code], ['Part number', p => p.part_number],
    ['In stock', p => p.quantity], ['Low-stock alert at', p => p.min_qty || ''], ['Price each', p => p.unit_price ?? ''], ['Stock value', p => hasH(p.unit_price) ? (p.quantity * p.unit_price).toFixed(2) : ''],
    ['Condition', p => p.condition], ['Location', p => p.location], ['Notes', p => p.notes]]));
  if (what === 'moves') downloadText(`parts-movements-${stamp()}.csv`, toCSV([...S.part_moves].sort(byNewest), [
    ['Date', m => fmtDT(m.created_at)], ['Part', m => partById(m.part_id)?.name || ''], ['What', m => MOVE[m.kind] || m.kind], ['Qty', m => m.change],
    ['Person', m => m.person_name || ''], ['Fixture', m => m.asset_id ? tagOf(m.asset_id) : ''], ['Price each', m => partById(m.part_id)?.unit_price ?? ''],
    ['Notes', m => m.notes?.startsWith('Return of ') ? '' : m.notes], ['Logged by', m => nameOf(m.created_by)]]));
  if (what === 'logs') {
    const from = opts.from ? new Date(opts.from + 'T00:00:00') : new Date(0), to = opts.to ? new Date(opts.to + 'T23:59:59') : new Date();
    const rows = S.logs.filter(l => { const d = new Date(l.created_at); return d >= from && d <= to; }).sort(byNewest);
    downloadText(`maintenance-log-${stamp()}.csv`, toCSV(rows, [
      ['Date', l => fmtDT(l.created_at)], ['Asset tag', l => tagOf(l.asset_id)], ['Model', l => assetById(l.asset_id)?.model || ''], ['Type', l => l.kind], ['Summary', l => l.title],
      ['Details', l => l.details], ['Parts', l => l.parts], ['Lamp hours', l => l.lamp_hours], ['Fixture hours', l => l.fixture_hours], ['Status after', l => l.status_after], ['By', l => whoOf(l)], ['Photos', l => l.photos?.length || 0]]));
    toast(`${rows.length} entries exported`);
  }
}
const filteredAssetsAll = () => [...S.assets].sort((x, y) => String(x.tag).localeCompare(String(y.tag), undefined, { numeric: true }));
const faultRows = () => S.assets.filter(a => BAD.includes(a.status)).sort((x, y) => new Date(x.faulty_since || 0) - new Date(y.faulty_since || 0));
function printDoc(html) { $('#print').innerHTML = html; setTimeout(() => window.print(), 50); }
function printAsset(a) {
  const logs = S.logs.filter(l => l.asset_id === a.id).sort(byNewest);
  printDoc(`<h1>${h(a.tag)} — ${h(a.make)} ${h(a.model)}</h1>
  <div class="sub">Serial ${h(a.serial || '—')} · ${h(a.category)} · ${h(a.location || '—')} · Status: ${h(a.status)}${hasH(a.lamp_hours) ? ' · Lamp ' + fmtH(a.lamp_hours) : ''}${hasH(a.fixture_hours) ? ' · Fixture ' + fmtH(a.fixture_hours) : ''}<br>Printed ${fmtDT(new Date())} by ${h(S.profile.name)}</div>
  <h2>Maintenance history (${logs.length})</h2>
  <table><thead><tr><th>Date</th><th>Type</th><th>Summary & details</th><th>Parts</th><th>Lamp h</th><th>Fixture h</th><th>Status</th><th>By</th></tr></thead><tbody>
  ${logs.map(l => `<tr><td>${fmtDT(l.created_at)}</td><td>${h(l.kind)}</td><td><b>${h(l.title)}</b>${l.details ? '<br>' + h(l.details).replace(/\n/g, '<br>') : ''}</td><td>${h(l.parts)}</td><td>${h(l.lamp_hours ?? '')}</td><td>${h(l.fixture_hours ?? '')}</td><td>${h(l.status_after || '')}</td><td>${h(whoOf(l))}</td></tr>`).join('') || '<tr><td colspan="8">No entries</td></tr>'}
  </tbody></table>`);
}
function printFaults() {
  const rows = faultRows();
  printDoc(`<h1>Fault report</h1><div class="sub">${rows.length} items faulty, in repair or out of service · Printed ${fmtDT(new Date())}</div>
  <table><thead><tr><th>Tag</th><th>Item</th><th>Status</th><th>Since</th><th>Days</th><th>Latest note</th><th>Location</th></tr></thead><tbody>
  ${rows.map(a => { const l = lastActivity(a); const d = a.faulty_since ? daysSince(a.faulty_since) : ''; return `<tr><td>${h(a.tag)}</td><td>${h(a.make)} ${h(a.model)}</td><td>${h(a.status)}</td><td>${fmtDate(a.faulty_since)}</td><td>${d}${d >= CFG.FAULT_ALERT_DAYS ? ' ⚠' : ''}</td><td>${l ? h(l.title) : ''}</td><td>${h(a.location || '')}</td></tr>`; }).join('') || '<tr><td colspan="7">Nothing faulty</td></tr>'}
  </tbody></table>`);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  if (t.tagName === 'A' && t.getAttribute('href') === '#') e.preventDefault();
  if (t.id === 'modal' && e.target !== t) return;
  ACT[t.dataset.act]?.(t.dataset, t, e);
});

    if (!r.session) { S.authTab = 'signin'; render(); toast('Account created — check your email to confirm, then sign in.'); }
  },
  async newpw(f) { await api.setPw(new FormData(f).get('password')); S.recovery = false; toast('Password updated'); history.replaceState(null, '', location.pathname + '#/dashboard'); await boot(); },
  async lookup(f) { lookup(new FormData(f).get('code')); f.reset(); },
  'link-code': linkCode, part: submitPart, checkout: submitCheckout, restock: submitRestock, asset: submitAsset, log: submitLog, sched: submitSched, manual: submitManual,
  async 'export-logs'(f) { const fd = new FormData(f); exportCSV('logs', { from: fd.get('from'), to: fd.get('to') }); },
};
document.addEventListener('submit', async e => {
  const f = e.target; const fn = FORMS[f.dataset.form]; if (!fn) return;
  e.preventDefault();
  const btn = f.querySelector('button:not([type=button])'); const label = btn?.innerHTML;
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  try { await fn(f); }
  catch (err) { const box = $('#auth-err'); if (box && f.closest('.auth')) box.textContent = errMsg(err); else toast(errMsg(err), 'bad'); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = label; } }
});
document.addEventListener('input', e => {
  const k = e.target.dataset.filter; if (!k) return;
  if (k === 'partQ') { S.partQ = e.target.value; $('#part-list').innerHTML = partTable(); return; }
  if (k === 'manualQ') { S.manualQ = e.target.value; const keep = e.target.selectionStart; render(); const i = $('[data-filter=manualQ]'); i.focus(); i.setSelectionRange(keep, keep); return; }
  S.filter[k] = e.target.value; $('#asset-list').innerHTML = assetTable();
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.photoScan !== undefined) return scanPhoto(t);
  if (t.dataset.filter === 'partMake') { S.partMake = t.value; $('#part-list').innerHTML = partTable(); return; }
  if (t.dataset.filter && t.tagName === 'SELECT') { S.filter[t.dataset.filter] = t.value; $('#asset-list').innerHTML = assetTable(); return; }
  if (t.dataset.roleFor) {
    try { const p = await api.update('profiles', t.dataset.roleFor, { role: t.value }); Object.assign(S.profiles.find(x => x.id === p.id), p); toast('Access updated'); render(); }
    catch (err) { toast(errMsg(err), 'bad'); render(); }
  }
  if (t.name === 'kind' && t.closest('[data-form=log]')) {
    const f = t.closest('form'), cur = t.dataset.cur;
    const st = t.value === 'Fault' ? (BAD.includes(cur) ? cur : 'Faulty') : t.value === 'Repair' ? 'OK' : cur;
    f.status_after.value = st;
    $('#sched-field').hidden = !(t.value === 'Service' && f.schedule_id.options.length > 1);
  }
  if (t.name === 'scope' && t.closest('[data-form=sched]')) { $('#scope-model').hidden = t.value !== 'model'; $('#scope-asset').hidden = t.value !== 'asset'; }
});
document.addEventListener('visibilitychange', async () => {
  if (document.hidden || DEMO || !S.profile || S.profile.role === 'pending' || $('#modal.open') || qr) return;
  try { await loadAll(); render(); } catch {}
});

/* ---------- start ---------- */
if (sb) {
  sb.auth.onAuthStateChange((ev, session) => {
    if (ev === 'PASSWORD_RECOVERY') { S.recovery = true; setTimeout(render, 0); return; }
    if (ev === 'SIGNED_IN' && session?.user?.id !== S.user?.id) setTimeout(boot, 0);
    if (ev === 'SIGNED_OUT') { Object.assign(S, { user:null, profile:null, assets:[], logs:[], schedules:[], manuals:[], profiles:[] }); setTimeout(render, 0); }
  });
}
if (!DEMO && !window.supabase) { $('#app').innerHTML = '<div class="center muted">Could not load the database library. Check your internet connection and reload.</div>'; }
else boot();
</script>
</body>
